name: Release

on:
  push:
    tags:
      - v*
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE }}
      PFX_SIGNING_CONFIGURATION_PRESENT: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' || secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD != '' || vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT != '' }}
      ARTIFACT_SIGNING_CONFIGURATION_PRESENT: ${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_ID != '' || secrets.WINDOWS_SIGNING_AZURE_TENANT_ID != '' || secrets.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID != '' || vars.WINDOWS_ARTIFACT_SIGNING_ENDPOINT != '' || vars.WINDOWS_ARTIFACT_SIGNING_ACCOUNT_NAME != '' || vars.WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME != '' || vars.WINDOWS_SIGNING_EXPECTED_SUBSCRIBER_IDENTITY_EKU != '' || vars.WINDOWS_SIGNING_EXPECTED_ROOT_THUMBPRINT != '' }}
      PFX_SIGNING_REQUESTED: ${{ vars.WINDOWS_SIGNING_MODE == 'pfx' }}
      ARTIFACT_SIGNING_REQUESTED: ${{ vars.WINDOWS_SIGNING_MODE == 'artifact-signing' }}
      CONTINUITY_SIGNING_EXPECTED_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
      CONTINUITY_SIGNING_EXPECTED_SUBSCRIBER_IDENTITY_EKU: ${{ vars.WINDOWS_SIGNING_EXPECTED_SUBSCRIBER_IDENTITY_EKU }}
      CONTINUITY_SIGNING_EXPECTED_ROOT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_EXPECTED_ROOT_THUMBPRINT }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/CodexContinuity.Tests/CodexContinuity.Tests.csproj
      - name: Validate release signing configuration
        shell: pwsh
        run: |
          $mode = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_MODE)) { 'unsigned' } else { $env:WINDOWS_SIGNING_MODE }
          if ($mode -notin @('unsigned', 'artifact-signing', 'pfx')) {
            throw "WINDOWS_SIGNING_MODE must be unsigned, artifact-signing, or pfx; received '$mode'."
          }
          $pfxPresent = $env:PFX_SIGNING_CONFIGURATION_PRESENT -eq 'true'
          $artifactPresent = $env:ARTIFACT_SIGNING_CONFIGURATION_PRESENT -eq 'true'
          if ($mode -eq 'unsigned' -and ($pfxPresent -or $artifactPresent)) {
            throw 'Signing settings are present, but WINDOWS_SIGNING_MODE is not selected. Set the mode explicitly or remove the partial configuration.'
          }
          if ($mode -eq 'pfx' -and $artifactPresent) {
            throw 'PFX and Azure Artifact Signing settings cannot be configured together.'
          }
          if ($mode -eq 'artifact-signing' -and $pfxPresent) {
            throw 'PFX settings cannot be configured while WINDOWS_SIGNING_MODE=artifact-signing.'
          }
          if ($mode -eq 'artifact-signing') {
            $required = @{
              'WINDOWS_SIGNING_AZURE_CLIENT_ID' = $env:WINDOWS_SIGNING_AZURE_CLIENT_ID
              'WINDOWS_SIGNING_AZURE_TENANT_ID' = $env:WINDOWS_SIGNING_AZURE_TENANT_ID
              'WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID' = $env:WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID
              'WINDOWS_ARTIFACT_SIGNING_ENDPOINT' = $env:WINDOWS_ARTIFACT_SIGNING_ENDPOINT
              'WINDOWS_ARTIFACT_SIGNING_ACCOUNT_NAME' = $env:WINDOWS_ARTIFACT_SIGNING_ACCOUNT_NAME
              'WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME' = $env:WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME
              'WINDOWS_SIGNING_EXPECTED_SUBSCRIBER_IDENTITY_EKU' = $env:CONTINUITY_SIGNING_EXPECTED_SUBSCRIBER_IDENTITY_EKU
              'WINDOWS_SIGNING_EXPECTED_ROOT_THUMBPRINT' = $env:CONTINUITY_SIGNING_EXPECTED_ROOT_THUMBPRINT
            }
            $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
            if ($missing.Count -gt 0) {
              throw "Artifact Signing configuration is incomplete. Missing: $($missing -join ', ')."
            }
          }
          Write-Host "Release signing mode: $mode"
        env:
          WINDOWS_SIGNING_AZURE_CLIENT_ID: ${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_ID }}
          WINDOWS_SIGNING_AZURE_TENANT_ID: ${{ secrets.WINDOWS_SIGNING_AZURE_TENANT_ID }}
          WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID: ${{ secrets.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}
          WINDOWS_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.WINDOWS_ARTIFACT_SIGNING_ENDPOINT }}
          WINDOWS_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
      - name: Verify release version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vX.Y.Z syntax: $tag"
          }
          $tagVersion = $Matches.version
          if ($env:RELEASE_REF -ne "refs/tags/$tag") {
            throw "Release ref must identify the exact tag: ref=$env:RELEASE_REF tag=$tag"
          }
          if ($env:RELEASE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Release SHA must be a full commit ID: $env:RELEASE_SHA"
          }
          $supervisorVersion = ([xml](Get-Content CodexContinuity.csproj -Raw)).Project.PropertyGroup.Version
          $trayVersion = ([xml](Get-Content tray/CodexContinuity.Tray.csproj -Raw)).Project.PropertyGroup.Version
          $siteVersion = (Get-Content site/package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $supervisorVersion -or $tagVersion -ne $trayVersion -or $tagVersion -ne $siteVersion) {
            throw "Release version mismatch: tag=$tagVersion supervisor=$supervisorVersion tray=$trayVersion site=$siteVersion"
          }
          $headSha = (git rev-parse HEAD).Trim()
          $tagSha = (git rev-list -n 1 "refs/tags/$tag").Trim()
          if ($headSha -ne $env:RELEASE_SHA -or $tagSha -ne $env:RELEASE_SHA) {
            throw "Release checkout and tag must match the green SHA: expected=$env:RELEASE_SHA HEAD=$headSha tag=$tagSha"
          }
      - run: dotnet build CodexContinuity.csproj --configuration Release --no-restore
      - run: dotnet test tests/CodexContinuity.Tests/CodexContinuity.Tests.csproj --configuration Release --no-restore
      - name: Publish single-file executable
        run: >-
          dotnet publish CodexContinuity.csproj --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --output publish
      - name: Publish notification-area controller
        run: >-
          dotnet publish tray/CodexContinuity.Tray.csproj --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --output publish-tray
      - name: Sign release executables with legacy PFX
        if: env.PFX_SIGNING_REQUESTED == 'true'
        shell: pwsh
        env:
          CONTINUITY_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CONTINUITY_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: .\scripts\sign-release.ps1 -Paths publish/CodexContinuity.exe,publish-tray/CodexContinuity.Tray.exe
      - name: Authenticate to Azure with OIDC
        if: env.ARTIFACT_SIGNING_REQUESTED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WINDOWS_SIGNING_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}
      - name: Sign release executables with Azure Artifact Signing
        if: env.ARTIFACT_SIGNING_REQUESTED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\publish\CodexContinuity.exe
            ${{ github.workspace }}\publish-tray\CodexContinuity.Tray.exe
          file-digest: SHA256
          enhanced-key-usage: 1.3.6.1.5.5.7.3.3
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify release signing policy
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_MODE -eq 'pfx') {
            .\scripts\sign-release.ps1 -Paths publish/CodexContinuity.exe,publish-tray/CodexContinuity.Tray.exe -VerifyOnly
          } elseif ($env:WINDOWS_SIGNING_MODE -eq 'artifact-signing') {
            .\scripts\sign-release.ps1 -Paths publish/CodexContinuity.exe,publish-tray/CodexContinuity.Tray.exe -VerifyOnly
          } else {
            Write-Warning 'Authenticode certificate is not configured; release artifacts will be unsigned.'
            .\scripts\sign-release.ps1 -Paths publish/CodexContinuity.exe,publish-tray/CodexContinuity.Tray.exe -VerifyOnly -RequireUnsigned
          }
      - name: Package release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $folder = "CodexContinuity-$tag-win-x64"
          New-Item -ItemType Directory -Path "release/$folder" | Out-Null
          Copy-Item publish/CodexContinuity.exe "release/$folder/"
          Copy-Item publish-tray/CodexContinuity.Tray.exe "release/$folder/"
          Copy-Item README.md,LICENSE,SECURITY.md "release/$folder/"
          Compress-Archive -Path "release/$folder" -DestinationPath "release/$folder.zip"
          $hash = (Get-FileHash "release/$folder.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $folder.zip" | Set-Content "release/$folder.zip.sha256"
          Copy-Item "release/$folder.zip" "release/CodexContinuity-win-x64.zip"
          $stableHash = (Get-FileHash "release/CodexContinuity-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$stableHash  CodexContinuity-win-x64.zip" | Set-Content "release/CodexContinuity-win-x64.zip.sha256"
          Copy-Item publish/CodexContinuity.exe "release/CodexContinuity-$tag-Setup.exe"
          $setupHash = (Get-FileHash "release/CodexContinuity-$tag-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  CodexContinuity-$tag-Setup.exe" | Set-Content "release/CodexContinuity-$tag-Setup.exe.sha256"
          Copy-Item "release/CodexContinuity-$tag-Setup.exe" "release/CodexContinuity-Setup.exe"
          "$setupHash  CodexContinuity-Setup.exe" | Set-Content "release/CodexContinuity-Setup.exe.sha256"
          $version = $tag.TrimStart('v')
          $installerUrl = "https://github.com/YesterdaysLemon/codex-continuity/releases/download/$tag/CodexContinuity-$tag-Setup.exe"
          .\scripts\write-winget-manifests.ps1 -Version $version -InstallerUrl $installerUrl -InstallerSha256 $setupHash -ReleaseDate (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd') -OutputDirectory release/winget
          winget --version
          $validationOutput = winget validate --manifest release/winget --disable-interactivity 2>&1
          $validationExitCode = $LASTEXITCODE
          $validationOutput | Write-Host
          $validationText = $validationOutput -join "`n"
          if ($validationExitCode -ne 0 -and $validationText -notmatch 'Manifest validation succeeded') {
            throw "WinGet manifest validation failed with exit code $validationExitCode."
          }
          $global:LASTEXITCODE = 0
          Compress-Archive -Path release/winget/* -DestinationPath "release/CodexContinuity-$tag-winget-manifests.zip"
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.exe
            release/*.zip
            release/*.sha256
            install.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $remoteTagLines = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0 -or $remoteTagLines.Count -eq 0) {
            throw "Could not resolve remote release tag $tag."
          }
          $remoteTagLine = $remoteTagLines |
            Where-Object { $_ -match '\^\{\}$' } |
            Select-Object -First 1
          if (-not $remoteTagLine) {
            $remoteTagLine = $remoteTagLines | Select-Object -First 1
          }
          $remoteTagSha = ($remoteTagLine -split '\s+')[0]
          if ($remoteTagSha -ne $env:RELEASE_SHA) {
            throw "Remote release tag moved: expected=$env:RELEASE_SHA tag=$remoteTagSha"
          }
          $assets = @(
            "release/CodexContinuity-$tag-win-x64.zip"
            "release/CodexContinuity-$tag-win-x64.zip.sha256"
            "release/CodexContinuity-win-x64.zip"
            "release/CodexContinuity-win-x64.zip.sha256"
            "release/CodexContinuity-$tag-Setup.exe"
            "release/CodexContinuity-$tag-Setup.exe.sha256"
            "release/CodexContinuity-Setup.exe"
            "release/CodexContinuity-Setup.exe.sha256"
            "release/CodexContinuity-$tag-winget-manifests.zip"
            "install.ps1"
          )
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not replace incomplete release assets for $tag."
            }
            gh release edit $tag --draft=false --prerelease=false --latest --verify-tag --title "Codex Continuity $tag"
          } else {
            gh release create $tag @assets --verify-tag --generate-notes --title "Codex Continuity $tag"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish complete stable release $tag."
          }
