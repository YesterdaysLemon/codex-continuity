name: Release

on:
  push:
    tags:
      - v*
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      SIGNING_CONFIGURED: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/CodexContinuity.Tests/CodexContinuity.Tests.csproj
      - name: Verify release version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vX.Y.Z syntax: $tag"
          }
          $tagVersion = $Matches.version
          if ($env:RELEASE_REF -ne "refs/tags/$tag") {
            throw "Release ref must identify the exact tag: ref=$env:RELEASE_REF tag=$tag"
          }
          if ($env:RELEASE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Release SHA must be a full commit ID: $env:RELEASE_SHA"
          }
          $supervisorVersion = ([xml](Get-Content CodexContinuity.csproj -Raw)).Project.PropertyGroup.Version
          $trayVersion = ([xml](Get-Content tray/CodexContinuity.Tray.csproj -Raw)).Project.PropertyGroup.Version
          $siteVersion = (Get-Content site/package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $supervisorVersion -or $tagVersion -ne $trayVersion -or $tagVersion -ne $siteVersion) {
            throw "Release version mismatch: tag=$tagVersion supervisor=$supervisorVersion tray=$trayVersion site=$siteVersion"
          }
          $headSha = (git rev-parse HEAD).Trim()
          $tagSha = (git rev-list -n 1 "refs/tags/$tag").Trim()
          if ($headSha -ne $env:RELEASE_SHA -or $tagSha -ne $env:RELEASE_SHA) {
            throw "Release checkout and tag must match the green SHA: expected=$env:RELEASE_SHA HEAD=$headSha tag=$tagSha"
          }
      - run: dotnet build CodexContinuity.csproj --configuration Release --no-restore
      - run: dotnet test tests/CodexContinuity.Tests/CodexContinuity.Tests.csproj --configuration Release --no-restore
      - name: Publish single-file executable
        run: >-
          dotnet publish CodexContinuity.csproj --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --output publish
      - name: Publish notification-area controller
        run: >-
          dotnet publish tray/CodexContinuity.Tray.csproj --configuration Release
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --output publish-tray
      - name: Sign release executables
        if: env.SIGNING_CONFIGURED == 'true'
        shell: pwsh
        env:
          CONTINUITY_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CONTINUITY_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: .\scripts\sign-release.ps1 -Paths publish/CodexContinuity.exe,publish-tray/CodexContinuity.Tray.exe
      - name: Verify release signing policy
        shell: pwsh
        run: |
          if ($env:SIGNING_CONFIGURED -eq 'true') {
            .\scripts\sign-release.ps1 -Paths publish/CodexContinuity.exe,publish-tray/CodexContinuity.Tray.exe -VerifyOnly
          } else {
            Write-Warning 'Authenticode certificate is not configured; release artifacts will be unsigned.'
            .\scripts\sign-release.ps1 -Paths publish/CodexContinuity.exe,publish-tray/CodexContinuity.Tray.exe -VerifyOnly -AllowUnsigned
          }
      - name: Package release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $folder = "CodexContinuity-$tag-win-x64"
          New-Item -ItemType Directory -Path "release/$folder" | Out-Null
          Copy-Item publish/CodexContinuity.exe "release/$folder/"
          Copy-Item publish-tray/CodexContinuity.Tray.exe "release/$folder/"
          Copy-Item README.md,LICENSE,SECURITY.md "release/$folder/"
          Compress-Archive -Path "release/$folder" -DestinationPath "release/$folder.zip"
          $hash = (Get-FileHash "release/$folder.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $folder.zip" | Set-Content "release/$folder.zip.sha256"
          Copy-Item "release/$folder.zip" "release/CodexContinuity-win-x64.zip"
          $stableHash = (Get-FileHash "release/CodexContinuity-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$stableHash  CodexContinuity-win-x64.zip" | Set-Content "release/CodexContinuity-win-x64.zip.sha256"
          Copy-Item publish/CodexContinuity.exe "release/CodexContinuity-$tag-Setup.exe"
          $setupHash = (Get-FileHash "release/CodexContinuity-$tag-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  CodexContinuity-$tag-Setup.exe" | Set-Content "release/CodexContinuity-$tag-Setup.exe.sha256"
          Copy-Item "release/CodexContinuity-$tag-Setup.exe" "release/CodexContinuity-Setup.exe"
          "$setupHash  CodexContinuity-Setup.exe" | Set-Content "release/CodexContinuity-Setup.exe.sha256"
          $version = $tag.TrimStart('v')
          $installerUrl = "https://github.com/YesterdaysLemon/codex-continuity/releases/download/$tag/CodexContinuity-$tag-Setup.exe"
          .\scripts\write-winget-manifests.ps1 -Version $version -InstallerUrl $installerUrl -InstallerSha256 $setupHash -ReleaseDate (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd') -OutputDirectory release/winget
          winget --version
          $validationOutput = winget validate --manifest release/winget --disable-interactivity 2>&1
          $validationExitCode = $LASTEXITCODE
          $validationOutput | Write-Host
          $validationText = $validationOutput -join "`n"
          if ($validationExitCode -ne 0 -and $validationText -notmatch 'Manifest validation succeeded') {
            throw "WinGet manifest validation failed with exit code $validationExitCode."
          }
          $global:LASTEXITCODE = 0
          Compress-Archive -Path release/winget/* -DestinationPath "release/CodexContinuity-$tag-winget-manifests.zip"
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.exe
            release/*.zip
            release/*.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $remoteTagLines = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0 -or $remoteTagLines.Count -eq 0) {
            throw "Could not resolve remote release tag $tag."
          }
          $remoteTagLine = $remoteTagLines |
            Where-Object { $_ -match '\^\{\}$' } |
            Select-Object -First 1
          if (-not $remoteTagLine) {
            $remoteTagLine = $remoteTagLines | Select-Object -First 1
          }
          $remoteTagSha = ($remoteTagLine -split '\s+')[0]
          if ($remoteTagSha -ne $env:RELEASE_SHA) {
            throw "Remote release tag moved: expected=$env:RELEASE_SHA tag=$remoteTagSha"
          }
          $assets = @(
            "release/CodexContinuity-$tag-win-x64.zip"
            "release/CodexContinuity-$tag-win-x64.zip.sha256"
            "release/CodexContinuity-win-x64.zip"
            "release/CodexContinuity-win-x64.zip.sha256"
            "release/CodexContinuity-$tag-Setup.exe"
            "release/CodexContinuity-$tag-Setup.exe.sha256"
            "release/CodexContinuity-Setup.exe"
            "release/CodexContinuity-Setup.exe.sha256"
            "release/CodexContinuity-$tag-winget-manifests.zip"
            "install.ps1"
          )
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not replace incomplete release assets for $tag."
            }
            gh release edit $tag --draft=false --prerelease=false --latest --verify-tag --title "Codex Continuity $tag"
          } else {
            gh release create $tag @assets --verify-tag --generate-notes --title "Codex Continuity $tag"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish complete stable release $tag."
          }
