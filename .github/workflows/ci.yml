name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CodexContinuity.csproj
      - run: dotnet restore tests/CodexContinuity.Tests/CodexContinuity.Tests.csproj
      - run: dotnet format CodexContinuity.csproj --verify-no-changes --no-restore
      - run: dotnet format tray/CodexContinuity.Tray.csproj --verify-no-changes --no-restore
      - run: dotnet format tests/CodexContinuity.ProcessHarness/CodexContinuity.ProcessHarness.csproj --verify-no-changes --no-restore
      - run: dotnet format tests/CodexContinuity.InstallerFixture/CodexContinuity.InstallerFixture.csproj --verify-no-changes --no-restore
      - run: dotnet format tests/CodexContinuity.Tests/CodexContinuity.Tests.csproj --verify-no-changes --no-restore
      - run: dotnet build CodexContinuity.csproj --configuration Release --no-restore
      - run: dotnet build tray/CodexContinuity.Tray.csproj --configuration Release --no-restore
      - run: dotnet test tests/CodexContinuity.Tests/CodexContinuity.Tests.csproj --configuration Release --no-restore
      - run: dotnet run --configuration Release --no-build -- help
      - shell: pwsh
        run: .\scripts\build-icons.ps1 -Check -ExecutablePath .\bin\Release\net10.0-windows\CodexContinuity.exe
      - shell: pwsh
        run: .\scripts\build-icons.ps1 -Check -ExecutablePath .\tray\bin\Release\net10.0-windows\CodexContinuity.Tray.exe -ExpectedDescription 'Codex Continuity Tray' -ExpectedOriginalFilename 'CodexContinuity.Tray.dll'
      - shell: pwsh
        run: .\scripts\build-social-card.ps1 -Check
      - name: Stage fail-closed Store package prototype
        shell: pwsh
        run: |
          .\scripts\stage-store-prototype.ps1 `
            -IdentityName 'YesterdaysLemon.CodexContinuity.CIPrototype' `
            -Publisher 'CN=Codex Continuity CI Prototype' `
            -PublisherDisplayName 'YesterdaysLemon'
          if ($LASTEXITCODE -ne 0) {
            throw "Store prototype staging failed with exit code $LASTEXITCODE."
          }
          $root = [IO.Path]::GetFullPath('artifacts/store-prototype')
          $manifest = [xml](Get-Content (Join-Path $root 'AppxManifest.xml') -Raw)
          $readiness = Get-Content (Join-Path $root 'store-readiness.json') -Raw | ConvertFrom-Json
          $startupTasks = @($manifest.SelectNodes("//*[local-name()='StartupTask']"))
          if ($manifest.Package.Identity.Version -ne $readiness.runtimePreflight.proposedPackageVersion -or
              $startupTasks.Count -ne 1 -or
              $startupTasks[0].Enabled -ne 'false' -or
              $readiness.stagedArtifact -ne 'nonShippablePackagedPrototype' -or
              $readiness.runtimePreflight.readyForSubmission -ne $false -or
              -not (Test-Path (Join-Path $root 'Supervisor/CodexContinuity.exe')) -or
              -not (Test-Path (Join-Path $root 'Tray/CodexContinuity.Tray.exe')) -or
              -not (Test-Path (Join-Path $root 'DO-NOT-SUBMIT.txt')) -or
              @(Get-ChildItem $root -Recurse -File -Include *.msix,*.msixupload).Count -ne 0) {
            throw 'Store prototype escaped its fail-closed layout contract.'
          }
      - name: Verify unsigned signing policy
        shell: pwsh
        run: >-
          .\scripts\test-sign-release-policy.ps1
          -Paths .\bin\Release\net10.0-windows\CodexContinuity.exe,.\tray\bin\Release\net10.0-windows\CodexContinuity.Tray.exe
      - shell: pwsh
        run: |
          $plan = .\install.ps1 -Plan -Json | ConvertFrom-Json
          if ($plan.assetUrl -ne 'https://github.com/YesterdaysLemon/codex-continuity/releases/latest/download/CodexContinuity-win-x64.zip') {
            throw "Unexpected stable asset URL: $($plan.assetUrl)"
          }
          if ($plan.restartsCodex) {
            throw 'The bootstrapper must never restart Codex.'
          }
      - name: Clean per-user install and uninstall smoke test
        shell: pwsh
        run: |
          $productVersion = ([xml](Get-Content CodexContinuity.csproj -Raw)).Project.PropertyGroup.Version
          dotnet publish CodexContinuity.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/install-smoke
          dotnet publish tray/CodexContinuity.Tray.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/install-smoke
          Copy-Item .\artifacts\install-smoke\CodexContinuity.exe .\artifacts\install-smoke\CodexContinuity-Setup.exe
          $setupHelp = & .\artifacts\install-smoke\CodexContinuity-Setup.exe --help 2>&1
          $setupHelpText = $setupHelp -join "`n"
          if ($LASTEXITCODE -ne 0 -or $setupHelpText -notmatch 'Codex Continuity keeps') {
            throw 'Renamed Setup executable did not provide read-only help.'
          }
          $stateDirectory = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'YesterdaysLemon\CodexContinuity'))
          $statePath = Join-Path $stateDirectory 'install-state.json'
          $commandDirectory = Join-Path $stateDirectory 'bin'
          $commandExecutable = Join-Path $commandDirectory 'CodexContinuity.exe'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runOnceKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CodexContinuity'
          $pathBefore = [Environment]::GetEnvironmentVariable('Path', 'User')
          try {
            try {
              & .\artifacts\install-smoke\CodexContinuity.exe install --port 45129
              if ($LASTEXITCODE -ne 0) {
                throw 'Per-user install smoke test failed.'
              }
              $state = Get-Content $statePath -Raw | ConvertFrom-Json
              $registration = Get-ItemProperty $uninstallKey
              $supervisorStartup = Get-ItemPropertyValue $runKey -Name CodexContinuity
              $trayStartup = Get-ItemPropertyValue $runKey -Name CodexContinuityTray
              $appServerUrl = [Environment]::GetEnvironmentVariable('CODEX_APP_SERVER_WS_URL', 'User')
              $updaterSetting = [Environment]::GetEnvironmentVariable('CODEX_SPARKLE_ENABLED', 'User')
              $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
              if ($state.schemaVersion -ne 4 -or
                  $state.port -ne 45129 -or
                  -not (Test-Path -LiteralPath $state.installedExecutable) -or
                  -not (Test-Path -LiteralPath $state.installedTrayExecutable) -or
                  -not (Test-Path -LiteralPath $commandExecutable) -or
                  $state.commandPath.appliedValue -ne $userPath -or
                  ($userPath -split ';') -notcontains $commandDirectory -or
                  $state.startupCommand.appliedValue -ne $supervisorStartup -or
                  $state.trayStartupCommand.appliedValue -ne $trayStartup -or
                  $appServerUrl -ne 'ws://127.0.0.1:45129' -or
                  $updaterSetting -ne 'false' -or
                  $registration.DisplayName -ne 'Codex Continuity' -or
                  $registration.DisplayVersion -ne $productVersion -or
                  $registration.UninstallString -notlike "*$commandExecutable*") {
                throw 'Install smoke state did not match the requested lifecycle configuration.'
              }
              & $commandExecutable --help
              if ($LASTEXITCODE -ne 0) {
                throw 'Installed PATH command smoke test failed.'
              }
              & $commandExecutable repair
              if ($LASTEXITCODE -ne 0) {
                throw 'Per-user repair smoke test failed.'
              }
            }
            finally {
              $uninstallExecutable = if (Test-Path -LiteralPath $commandExecutable) {
                $commandExecutable
              } else {
                '.\artifacts\install-smoke\CodexContinuity.exe'
              }
              & $uninstallExecutable uninstall
            }
            $uninstallExitCode = $LASTEXITCODE
            $runValuesAfter = Get-ItemProperty $runKey -ErrorAction SilentlyContinue
            $supervisorStartupAfter = $runValuesAfter.PSObject.Properties['CodexContinuity'].Value
            $trayStartupAfter = $runValuesAfter.PSObject.Properties['CodexContinuityTray'].Value
            $cleanupCommand = Get-ItemPropertyValue $runOnceKey -Name '!CodexContinuityCleanup'
            if ($uninstallExitCode -ne 0 -or
                (Test-Path $uninstallKey) -or
                (Test-Path $statePath) -or
                -not (Test-Path -LiteralPath $commandExecutable) -or
                $cleanupCommand -notlike "*$stateDirectory*" -or
                $pathBefore -ne ([Environment]::GetEnvironmentVariable('Path', 'User')) -or
                $null -ne $supervisorStartupAfter -or
                $null -ne $trayStartupAfter -or
                $null -ne ([Environment]::GetEnvironmentVariable('CODEX_APP_SERVER_WS_URL', 'User')) -or
                $null -ne ([Environment]::GetEnvironmentVariable('CODEX_SPARKLE_ENABLED', 'User'))) {
              throw 'Per-user uninstall smoke test failed.'
            }
          }
          finally {
            Remove-ItemProperty $runOnceKey -Name '!CodexContinuityCleanup' -ErrorAction SilentlyContinue
            [Environment]::SetEnvironmentVariable('Path', $pathBefore, 'User')
            $stateLeaf = Split-Path -Leaf $stateDirectory
            $stateParentLeaf = Split-Path -Leaf (Split-Path -Parent $stateDirectory)
            if ($stateLeaf -ne 'CodexContinuity' -or $stateParentLeaf -ne 'YesterdaysLemon') {
              throw "Refusing CI cleanup for unexpected state directory: $stateDirectory"
            }
            Remove-Item -LiteralPath $stateDirectory -Recurse -Force -ErrorAction SilentlyContinue
          }
          $setupHash = (Get-FileHash .\artifacts\install-smoke\CodexContinuity.exe -Algorithm SHA256).Hash
          .\scripts\write-winget-manifests.ps1 -Version $productVersion -InstallerUrl "https://example.invalid/CodexContinuity-v$productVersion-Setup.exe" -InstallerSha256 $setupHash -ReleaseDate 2026-08-22 -OutputDirectory artifacts/winget-smoke
          winget --version
          $validationOutput = winget validate --manifest artifacts/winget-smoke --disable-interactivity 2>&1
          $validationExitCode = $LASTEXITCODE
          $validationOutput | Write-Host
          $validationText = $validationOutput -join "`n"
          if ($validationExitCode -ne 0 -and $validationText -notmatch 'Manifest validation succeeded') {
            throw "WinGet manifest validation failed with exit code $validationExitCode."
          }
          exit 0
      - name: Verify cross-PowerShell WinGet reproducibility
        shell: powershell
        run: |
          $productVersion = ([xml](Get-Content CodexContinuity.csproj -Raw)).Project.PropertyGroup.Version
          $setupHash = (Get-FileHash .\artifacts\install-smoke\CodexContinuity.exe -Algorithm SHA256).Hash
          .\scripts\write-winget-manifests.ps1 -Version $productVersion -InstallerUrl "https://example.invalid/CodexContinuity-v$productVersion-Setup.exe" -InstallerSha256 $setupHash -ReleaseDate 2026-08-22 -OutputDirectory artifacts/winget-windows-powershell
          $referenceDirectory = [IO.Path]::GetFullPath('artifacts/winget-smoke')
          $comparisonDirectory = [IO.Path]::GetFullPath('artifacts/winget-windows-powershell')
          $referenceFiles = @(Get-ChildItem -LiteralPath $referenceDirectory -File | Sort-Object Name)
          $comparisonFiles = @(Get-ChildItem -LiteralPath $comparisonDirectory -File | Sort-Object Name)
          if (Compare-Object $referenceFiles.Name $comparisonFiles.Name) {
            throw 'WinGet generators produced different file sets across PowerShell runtimes.'
          }
          foreach ($referenceFile in $referenceFiles) {
            $comparisonPath = Join-Path $comparisonDirectory $referenceFile.Name
            $referenceHash = (Get-FileHash -LiteralPath $referenceFile.FullName -Algorithm SHA256).Hash
            $comparisonHash = (Get-FileHash -LiteralPath $comparisonPath -Algorithm SHA256).Hash
            if ($referenceHash -ne $comparisonHash) {
              throw "WinGet manifest differs across PowerShell runtimes: $($referenceFile.Name)"
            }
            $bytes = [IO.File]::ReadAllBytes($comparisonPath)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "WinGet manifest contains a UTF-8 BOM: $($referenceFile.Name)"
            }
            if ($bytes -contains 0x0D) {
              throw "WinGet manifest contains a non-canonical carriage return: $($referenceFile.Name)"
            }
            if ($bytes.Length -eq 0 -or $bytes[-1] -ne 0x0A) {
              throw "WinGet manifest is missing its canonical terminal LF: $($referenceFile.Name)"
            }
            if ($bytes.Length -ge 2 -and $bytes[-2] -eq 0x0A) {
              throw "WinGet manifest contains multiple terminal newlines: $($referenceFile.Name)"
            }
          }

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
