name: Deploy site after green CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm test
        working-directory: site
      - name: Verify the production container
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build --build-arg DEPLOY_REVISION="$REVISION" --file site/Dockerfile --tag "codex-continuity-site:$REVISION" .
          docker run --detach --name continuity-site-smoke --publish 127.0.0.1:8080:8080 "codex-continuity-site:$REVISION"
          trap 'docker rm --force continuity-site-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs continuity-site-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent http://127.0.0.1:8080/llms.txt >/dev/null
          test "$(curl --fail --silent http://127.0.0.1:8080/deploy-revision.txt)" = "$REVISION"
      - name: Deploy and verify the exact green revision
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.CONTINUITY_DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.CONTINUITY_DEPLOY_WEBHOOK_URL }}
          GITHUB_REF_NAME: main
          GITHUB_REPOSITORY: YesterdaysLemon/codex-continuity
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          PRODUCTION_URL: https://continuity.alirezaafshan.com
          SITES_URL: https://codex-continuity.alirezaafshan4.chatgpt.site
        run: node site/scripts/deploy-production.mjs
