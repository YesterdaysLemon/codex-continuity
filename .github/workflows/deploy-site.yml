name: Deploy site after green CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: codex-continuity-production-site
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm test
        working-directory: site
      - name: Verify the production container
        run: docker build --file site/Dockerfile --tag codex-continuity-site:${{ github.event.workflow_run.head_sha }} .
      - name: Deploy and verify the exact green revision
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.CONTINUITY_DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.CONTINUITY_DEPLOY_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: push
          GITHUB_REF_NAME: main
          GITHUB_REPOSITORY: YesterdaysLemon/codex-continuity
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          PRODUCTION_URL: https://continuity.alirezaafshan.com
          SITES_URL: https://codex-continuity.alirezaafshan4.chatgpt.site
        run: node site/scripts/deploy-production.mjs
